services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ALPACA_PAPER_KEY: ${ALPACA_PAPER_KEY:-}
      ALPACA_PAPER_SECRET: ${ALPACA_PAPER_SECRET:-}
      ALPACA_LIVE_KEY: ${ALPACA_LIVE_KEY:-}
      ALPACA_LIVE_SECRET: ${ALPACA_LIVE_SECRET:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ALLOW_LIVE_TRADING: ${ALLOW_LIVE_TRADING:-false}
      LIVE_CONFIRMATION_TOKEN: ${LIVE_CONFIRMATION_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/kronos.db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-jwt-secret-32b}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-Ew-PE79v7whzOuVHD2GJ4YHXIPD-THvZVQ2ItZsmvO8=}
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-stockpulse-logs}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - kronos-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  webui:
    profiles: [legacy]
    build:
      context: .
      dockerfile: Dockerfile.webui
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - huggingface-cache:/root/.cache/huggingface

  # Free local Elastic stack (Elasticsearch + Kibana). Start with:
  #   docker compose --profile observability up -d elasticsearch kibana
  elasticsearch:
    profiles: [observability]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    profiles: [observability]
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  huggingface-cache:
  kronos-data:
  elasticsearch-data:
