name: Model regression

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: model-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Download-backed CPU regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run pinned model regression
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: pytest -q tests/test_kronos_regression.py
