name: Bug report
description: Report a reproducible problem in Kronos or StockPulse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private account data, or security vulnerabilities.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core model
        - StockPulse backend
        - StockPulse frontend
        - Legacy web UI
        - Fine-tuning
        - Documentation or deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest complete set of steps or code.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, device, package versions, and model revision.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, account details, and proprietary data.
          required: true
